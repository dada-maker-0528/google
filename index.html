<script id="slide-data" type="application/json">[{"text":"AI 口述影像\n听·见\n选一部电影，\n听见画面中的每一个故事\n（智享视界项目）\nAI＋社会公益赛道　　产品大王队 · 路演版","title":"听·见","image":"assets/slide-01.webp","thumb":"assets/thumb-01.webp","links":[]},{"text":"01  社会问题分析\n02 / 11\n社会问题分析：盲人的影音娱乐，正在被政策点名\n1700 万+\n我国视障人士规模，约每 80 人中就有 1 人（中国残联数据）\n252 个放映点\n上海无障碍电影放映点街镇全覆盖，每年惠及超 2 万人次\n每月 ≥ 1 场\n上海要求商业影院开设无障碍电影专场，已写入工作通知\n发令枪已打响：上海先行\n· 《上海市残疾人事业发展“十四五”规划》提出打造“阳光无障碍电影”，引导制片方制作无障碍版本\n· 《关于进一步做好本市无障碍电影工作的通知》将商业影院专场写入常态机制\n· 国家“十五五”规划推广“光明影院”等无障碍影视点播专区\n江苏，是下一个落点\n· 江苏省残联方向明确，但尚未形成规模化供给\n· 上海推进到哪里，周边省份就跟进到哪里\n· 团队落地南京，具备直接承接的区位优势\n痛点：优酷、腾讯等平台的无障碍片源少、更新慢——视障用户听什么，由平台库存决定，而不是由自己决定。\n数据来源：中国残联；《上海市残疾人事业发展“十四五”规划》；《关于进一步做好本市无障碍电影工作的通知》","title":"社会问题分析","image":"assets/slide-02.webp","thumb":"assets/thumb-02.webp","links":[]},{"text":"02  解决方案\n03 / 11\n「听见」：让视障用户自己决定听什么、怎么听\n我们做什么\nAI 口述影像平台：用户自己导入视频，AI 为画面生成口述；先试听，再用语音提出修改，确认后得到属于自己的版本。从“平台有什么听什么”，变成“想看什么就听什么”。\n为什么是影音娱乐\n政策已点名的刚性需求；高频消费场景；AI 可标准化交付；Demo 已上线，可现场演示。\n赛道里的大多数\n· 自闭症儿童教育方向：商业化多年、同质化严重，已是红海\n· 真实世界引导方向：技术与安全均不达标，根本无法落地\n· 依赖人力服务，交付重、难标准化，规模化无从谈起\n听见\n· AI 全流程生成与修改，一次开发、持续复用\n· 边际成本随大模型降价持续递减\n· 已有可演示 Demo，落地路径清晰\n定位：ToB 公益型平台——服务残联、公益机构与内容平台，而不是一个个去服务个人。\n数据来源：赛道公开项目与竞品公开资料梳理；中国残联公开数据","title":"解决方案","image":"assets/slide-03.webp","thumb":"assets/thumb-03.webp","links":[]},{"text":"03  技术与产品\n04 / 11\n技术路径：站在语义侧，做语义标签，而不是单纯的时间序列\n技术核心\n为画面内容打语义标签，按叙事重要性排序——在对白与音效的空隙，插入观众此刻最该知道的信息。讲什么、讲多细、什么时候讲，由语义决定。\n技术链路\n视频理解\n语义标签化\n重要性排序\n口述稿生成\n语音合成\n试听反馈迭代\n反馈闭环：语音意见直接变成处理动作\n“语速太快”\n只放慢旁白，原片速度不变\n“没讲清动作”\n补充当前画面中的必要信息\n“描述太多了”\n压缩口述，保留理解必需内容\n用户确认前不覆盖已生成版本；确认后的设置沿用于本任务的后续片段。","title":"技术路径","image":"assets/slide-04.webp","thumb":"assets/thumb-04.webp","links":[]},{"text":"03  技术与产品\n05 / 11\n技术路径（二）：算法链路与工程约束，每一步都可核对\n采样与语义分组\n· 均匀采样：间隔 max(2s, 片长÷48)，单次 ≤ 48 帧、缩放至 640px\n· 多模态模型输出 firstFrame / lastFrame / evidenceFrame 结构化分组\n· 程序校验分组有序、连续、全覆盖，拦截缺段与越界\n对白保护与时长约束\n· ASR 带时间戳转写，已识别对白前后增加 0.3s 保护余量\n· 优先使用对白空隙；无可靠定位时，静音检测提供候选窗口\n· 旁白按 TTS 实际音频时长校验：实长 ≤ 可用窗口，超长自动精简、不硬截句尾\n模型与配置\n· 多模态理解：默认配置 MiniMax-M3，适配器可按运行环境覆盖\n· 语音识别：ASR-1.0，提取 16kHz 单声道 PCM 转写\n· 语音合成：已接入豆包 TTS，音色与语速按场景配置，后端保留多提供方适配\n工程可追溯\n· 语音缓存键：影片 × 文本 × 音色 × 语速 × 提示词摘要，相同输入复用\n· promptHash / configurationHash 配置快照，版本冲突检查防串稿\n· 音轨时长与解码完整性校验，区分“调用结束”与“得到有效媒体”\n试听反馈迭代：Enter 确认、8–15 秒分段试听、语音键直接提修改——修改面板保留当前片段与版本。","title":"算法链路与工程约束","image":"assets/slide-05.webp","thumb":"assets/thumb-05.webp","links":[]},{"text":"03  技术与产品\n06 / 11\n应用侧：听得懂、改得动、做得快\n操作，对盲人友好\n空格\n上传视频、播放 / 暂停\n1\n试听满意，确认并继续\nV\n暂停影片，说出修改需求\nEsc\n取消输入，保留当前任务\n全程语音提示，不依赖鼠标与视觉定位。\n剪辑与效率：“旁白慢一点”“后面都这样讲”——口语化的修改意见，由 AI 直接转成可执行的处理动作。","title":"应用侧","image":"assets/slide-06.webp","thumb":"assets/thumb-06.webp","links":[]},{"text":"听见\nAimedia\nDEMO\n现场演示\n从导入视频，到用语音改出一版属于自己的口述。\n打开 听见 ↗\n07 / 11\nhttps://tingjian.43.129.168.70.sslip.io/","title":"现场演示","image":"assets/slide-07.webp","thumb":"assets/thumb-07.webp","links":[{"url":"https://tingjian.43.129.168.70.sslip.io/","label":"打开原稿链接","x":6.716704724034865,"y":90.33592592592593,"w":40.312103227330425,"h":5.317592592592592}]},{"text":"05  发展路径\n08 / 11\n发展路径-三阶段：影音娱乐落地，Vlog 与短视频打开增量\n第一阶段 · 现在\n影音娱乐：AI 口述影像\n· 「听见」平台已上线，可现场演示\n· 用户导入视频，得到自己的口述版本\n· 经残联与公益放映触达首批用户\n已落地\n第二阶段 · 下一步\nhttps://tingjian-video-reader-demo.qilogan9.workers.dev/index.html\nVlog 剪辑 × 读屏软件\n分支一｜可交互 Vlog 剪辑\n语音指令完成剪辑、修改与导出——视障用户不只能“看”，也能创作。\n分支二｜自研读屏软件\n与视频、短视频软件深度结合，实时自动生成口述，让短视频直接“可听”。\n第一阶段已落地　→　第二阶段两条分支并行推进　→　第三阶段：看懂物理世界（见下页）","title":"发展路径 · 第一、二阶段","image":"assets/slide-08.webp","thumb":"assets/thumb-08.webp","links":[]},{"text":"听见\nAimedia\n05  发展路径 · 第三阶段\n第三阶段：从听懂视频，到看懂世界\n01\n硬件基座 · 影石 X5\n02\n双数据通路\n高清 INSV 原片：成片导出与精细分析；LRV / H.264 预览流：低成本实时语义理解（VLM → TTS）。\n03\n落地经验—世界行为模型企业级落地\n数据链路：影石 X5 →（INSV 原片 → 成片与精细分析）＋（H.264 预览流 → VLM 语义理解 → TTS 语音提醒）\n影音娱乐是入口，物理世界才是终局。\n数据来源：影石 Insta360 官网参数与 Camera SDK 官方文档（2026-09 调研）；本页为接入方案设计，设备联调推进中\n09 / 11","title":"发展路径 · 第三阶段","image":"assets/slide-09.webp","thumb":"assets/thumb-09.webp","links":[]},{"text":"06  团队\n10 / 11\n一支懂 $('prev').addEventListener('click',()=>show(current-1));$('next').addEventListener('click',()=>show(current+1));$('pages').addEventListener('click',openPages);$('close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>returnFocus?.focus());dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});$('jump-form').addEventListener('submit',event=>{event.preventDefault();const number=Number($('page-number').value);if(Number.isInteger(number)&&number>=1&&number<=slides.length){show(number-1);dialog.close()}});$('zoom').addEventListener('click',()=>zoomTo(zoomLevel===1?2:zoomLevel===2?3:1));$('fullscreen').addEventListener('click',toggleFullscreen);$('retry').addEventListener('click',()=>show(current));stage.addEventListener('dblclick',event=>{if(!event.target.closest('a,button'))zoomTo(zoomLevel===1?2:1)});
